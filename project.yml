name: SuitRecall
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en-GB
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 2
    GENERATE_INFOPLIST_FILE: YES
targets:
  SuitRecall:
    type: application
    platform: iOS
    sources: [Source]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: studio.suitrecall.memory
        INFOPLIST_KEY_CFBundleDisplayName: Guit Recall
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  SuitRecallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests, Source/Lesson.swift, Source/RecallSession.swift, Source/Workbook.swift]
    dependencies:
      - target: SuitRecall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.suitrecall.memory.uitests
        TEST_TARGET_NAME: SuitRecall
schemes:
  SuitRecall:
    build:
      targets:
        SuitRecall: all
    test:
      targets:
        - SuitRecallUITests
